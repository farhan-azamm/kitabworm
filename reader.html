<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KitabWorm - Reader</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="loading" class="loading">
        Opening book&hellip;
    </div>

    <main class="reader-shell">

        <!-- Pages are generated by script.js and handed to PageFlip. -->
        <div class="flipbook"></div>

        <div class="page-jump-control">
            <input type="number" id="pageJumpInput" min="1" placeholder="Page" aria-label="Page number">
            <button id="pageJumpBtn">Go</button>
        </div>

        <div class="font-size-control" id="fontSizeControl">
            <button id="fontSizeDown" type="button" aria-label="Decrease text size" title="Decrease text size">
                <span aria-hidden="true">&#9660;</span>
            </button>
            <span class="font-size-value" id="fontSizeValue" role="status" aria-live="polite">100%</span>
            <button id="fontSizeUp" type="button" aria-label="Increase text size" title="Increase text size">
                <span aria-hidden="true">&#9650;</span>
            </button>
        </div>

    </main>

    <!-- Third-party page-flip library -->
    <script src="page-flip.js"></script>

    <!-- Reader: loads a book, paginates it, drives the flipbook -->
    <script src="script.js"></script>

</body>
</html>
